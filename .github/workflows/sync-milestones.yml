name: Sync Milestones Across Org

on:
  milestone:
    types: [created, edited, deleted, closed, opened]
  workflow_dispatch:
    inputs:
      source_repo:
        description: "Source repo name (default: this repo)"
        required: false
        default: ""

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      issues: read
    outputs:
      chunks: ${{ steps.list-repos.outputs.chunks }}
      milestones: ${{ steps.list-milestones.outputs.milestones }}

    steps:
      - name: Generate GitHub App token
        uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ vars.LABEL_SYNC_APP_ID }}
          private-key: ${{ secrets.LABEL_SYNC_APP_PRIV_KEY }}
          owner: ${{ github.repository_owner }}

      - name: List repos
        id: list-repos
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ORG: ${{ github.repository_owner }}
          SOURCE_REPO: gardenlinux
        run: |
          repos=$(gh api --paginate "orgs/$ORG/repos?per_page=100" \
            --jq '[.[] | select(.archived == false) | .name] | map(select(. != "'"$SOURCE_REPO"'"))' \
            | jq -s 'add')
          chunks=$(echo "$repos" | python3 -c "import json,sys; r=json.load(sys.stdin); print(json.dumps([r[i:i+10] for i in range(0,len(r),10)]))")
          echo "Found $(echo "$repos" | jq length) repos in $(echo "$chunks" | jq length) chunks"
          echo "chunks<<EOF" >> "$GITHUB_OUTPUT"
          echo "$chunks" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: List milestones
        id: list-milestones
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ORG: ${{ github.repository_owner }}
          SOURCE_REPO: gardenlinux
        run: |
          milestones=$(gh api --paginate "repos/$ORG/$SOURCE_REPO/milestones?state=all&per_page=100" \
            --jq '[.[] | {title: .title, description: (.description // ""), due_on: (.due_on // ""), state: .state}]' \
            | jq -s 'add')
          echo "Found $(echo "$milestones" | jq length) milestones:"
          echo "$milestones" | jq -r '.[].title' | sed 's/^/  /'
          echo "milestones<<EOF" >> "$GITHUB_OUTPUT"
          echo "$milestones" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

  sync:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      issues: read
    strategy:
      fail-fast: false
      matrix:
        repos: ${{ fromJson(needs.prepare.outputs.chunks) }}

    steps:
      - name: Generate GitHub App token
        uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ vars.LABEL_SYNC_APP_ID }}
          private-key: ${{ secrets.LABEL_SYNC_APP_PRIV_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Sync milestones to chunk
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ORG: ${{ github.repository_owner }}
          REPOS: ${{ toJson(matrix.repos) }}
          MILESTONES: ${{ needs.prepare.outputs.milestones }}
        run: |
          set -euo pipefail

          echo "$REPOS" | jq -r '.[]' | while read -r REPO; do
            echo "=== Syncing milestones to $REPO ==="
            repo_milestones=$(gh api --paginate "repos/$ORG/$REPO/milestones?state=all&per_page=100" | jq -s 'add // []')

            echo "$MILESTONES" | jq -c '.[]' | while read -r milestone; do
              title=$(echo "$milestone" | jq -r '.title')
              description=$(echo "$milestone" | jq -r '.description')
              due_on=$(echo "$milestone" | jq -r '.due_on')
              state=$(echo "$milestone" | jq -r '.state')

              due_on_field=()
              if [ -n "$due_on" ]; then
                due_on_field=(--field due_on="$due_on")
              fi

              existing_milestone=$(echo "$repo_milestones" | jq -c --arg title "$title" '.[] | select(.title == $title)' || echo "")

              if [ -z "$existing_milestone" ]; then
                gh api --method POST "repos/$ORG/$REPO/milestones" \
                  --raw-field title="$title" \
                  --raw-field description="$description" \
                  --raw-field state="$state" \
                  "${due_on_field[@]}" \
                  --jq '"  [created] \(.title)"'
              else
                existing_desc=$(echo "$existing_milestone" | jq -r '.description // ""')
                existing_due=$(echo "$existing_milestone" | jq -r '.due_on // ""')
                existing_state=$(echo "$existing_milestone" | jq -r '.state')
                if [ "$existing_desc" = "$description" ] && [ "$existing_due" = "$due_on" ] && [ "$existing_state" = "$state" ]; then
                  echo "  [skip]    $title"
                else
                  number=$(echo "$existing_milestone" | jq -r '.number')
                  gh api --method PATCH "repos/$ORG/$REPO/milestones/$number" \
                    --raw-field title="$title" \
                    --raw-field description="$description" \
                    --raw-field state="$state" \
                    "${due_on_field[@]}" \
                    --jq '"  [updated] \(.title)"'
                fi
              fi
            done
          done
