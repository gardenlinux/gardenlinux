name: dev
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-dev
  cancel-in-progress: true
on:
  push:
    branches:
      - main
    paths-ignore:
      - ".gitignore"
      - ".github/workflows/docs*.yml"
      - 'docs/**'
      - 'features/*/README.md'
      - 'features/*/info.yaml'
      - 'CONTRIBUTING.md'
      - 'SECURITY.md'
  pull_request:
    # No paths-ignore on pull_request — workflow must run on every PR so that
    # build_and_test_gate always produces a check result for branch protection.
    # detect_changes skips the expensive build/test jobs on docs-only PRs.
jobs:
  detect_changes:
    name: Detect code path changes
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check for code path changes
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            code:
              - '!.gitignore'
              - '!.github/workflows/**'
              - '!docs/**'
              - '!features/*/README.md'
              - '!features/*/info.yaml'
              - '!CONTRIBUTING.md'
              - '!SECURITY.md'

  set_version:
    name: Set VERSION
    needs: detect_changes
    if: needs.detect_changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use VERSION file to support dev build on rel-branch
        id: version
        run: echo "version=$(cat VERSION)" >> $GITHUB_OUTPUT
  build:
    needs: set_version
    name: Build
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.set_version.outputs.version }}
      fail_fast: false
    permissions:
      id-token: write # TODO: 3215 elevated permissions for included workflow
      actions: write  # TODO: 3215 elevated permissions for included workflow
      packages: write # TODO: 3215 elevated permissions for included workflow
  test:
    needs: build
    if: ${{ success() || failure() }}
    name: Test
    uses: ./.github/workflows/tests.yml
    with:
      flavors_matrix: ${{ needs.build.outputs.flavors_matrix }}
      bare_flavors_matrix: ${{ needs.build.outputs.bare_flavors_matrix }}
      test_types: "chroot,qemu,oci,bare"
    permissions:
      id-token: write # TODO: 3215 elevated permissions for included workflow
      actions: write # TODO: 3215 elevated permissions for included workflow
      checks: write # Required for test_report job to write workflow summary

  build_and_test_gate:
    name: Build and test gate
    needs:
    - build
    - test
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Evaluate build and test result
        run: |
          CODE_CHANGED="${{ needs.detect_changes.outputs.code }}"

          if [[ "$CODE_CHANGED" != "true" ]]; then
            echo "No code paths changed; skipping build and test — gate passes."
            exit 0
          fi

          BUILD_RESULT="${{ needs.build.result }}"
          TEST_RESULT="${{ needs.test.result }}"

          if [[ "$BUILD_RESULT" != "success" ]]; then
            echo "Build result: $BUILD_RESULT"
            exit 1
          fi
          if [[ "$TEST_RESULT" != "success" ]]; then
            echo "Test result: $TEST_RESULT"
            exit 1
          fi

          echo "Build and test passed."
          exit 0
