name: Build Lima Container
on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'
      timzone: 'Europe/Berlin'

jobs:
  lima_manifest_container:
    name: Build Container for lima manifest generation
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: gardenlinux/gardenlinux/lima
      IMAGE_TAG: latest
    defaults:
      run:
        shell: bash
    permissions:
      # Push container images
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin@v7.0.1
      - name: Install qemu dependency for multi-arch build
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static podman

      - name: Build and Push Image to ghcr.io
        id: build_image
        uses: redhat-actions/buildah-build@719e3c40d8af9790c23eca13f7daa339f2867034 # v3.1.0
        with:
          image: ${{ env.IMAGE_NAME }}
          tags: ${{ env.IMAGE_TAG }}
          containerfiles: |
            ./Containerfile.lima-manifest
          platforms: linux/amd64,linux/arm64
      - name: Push image to ghcr.io
        uses: redhat-actions/push-to-registry@5ed88d269cf581ea9ef6dd6806d01562096bee9c # v2.8
        with:
          image: ${{ steps.build_image.outputs.image }}
          tags: ${{ steps.build_image.outputs.tags }}
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
