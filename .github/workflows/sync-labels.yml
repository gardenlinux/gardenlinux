name: Sync Labels Across Org

on:
  label:
    types: [created, edited, deleted]
  workflow_dispatch:
    inputs:
      source_repo:
        description: "Source repo name (default: this repo)"
        required: false
        default: ""

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      issues: read
    outputs:
      chunks: ${{ steps.list-repos.outputs.chunks }}
      labels: ${{ steps.list-labels.outputs.labels }}
      source_repo: ${{ steps.list-labels.outputs.source_repo }}

    steps:
      - name: Generate GitHub App token
        uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ vars.LABEL_SYNC_APP_ID }}
          private-key: ${{ secrets.LABEL_SYNC_APP_PRIV_KEY }}
          owner: ${{ github.repository_owner }}

      - name: List repos and labels
        id: list-labels
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ORG: ${{ github.repository_owner }}
          SOURCE_REPO: ${{ inputs.source_repo || github.event.repository.name }}
        run: |
          echo "Org: $ORG"
          echo "Source Repo: $SOURCE_REPO"
          echo "source_repo=$SOURCE_REPO" >> "$GITHUB_OUTPUT"

          labels=$(gh api --paginate "repos/$ORG/$SOURCE_REPO/labels?per_page=100" \
            --jq '[.[] | {name: .name, color: (.color // "ededed"), description: (.description // "")}]' \
            | jq -s 'add')
          echo "Found $(echo "$labels" | jq length) labels:"
          echo "$labels" | jq -r '.[].name' | sed 's/^/  /'
          echo "labels<<EOF" >> "$GITHUB_OUTPUT"
          echo "$labels" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: List repos
        id: list-repos
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ORG: ${{ github.repository_owner }}
          SOURCE_REPO: ${{ inputs.source_repo || github.event.repository.name }}
        run: |
          repos=$(gh api --paginate "orgs/$ORG/repos?per_page=100" \
            --jq '[.[] | select(.archived == false) | .name] | map(select(. != "'"$SOURCE_REPO"'"))' \
            | jq -s 'add')
          # Split into chunks of 10 — each matrix job processes one chunk
          # sequentially, giving parallelism while staying under the 256-job limit.
          chunks=$(echo "$repos" | python3 -c "import json,sys; r=json.load(sys.stdin); print(json.dumps([r[i:i+10] for i in range(0,len(r),10)]))")
          echo "Found $(echo "$repos" | jq length) repos in $(echo "$chunks" | jq length) chunks"
          echo "chunks<<EOF" >> "$GITHUB_OUTPUT"
          echo "$chunks" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

  sync:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      issues: read
    strategy:
      fail-fast: false
      matrix:
        repos: ${{ fromJson(needs.prepare.outputs.chunks) }}

    steps:
      - name: Generate GitHub App token
        uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ vars.LABEL_SYNC_APP_ID }}
          private-key: ${{ secrets.LABEL_SYNC_APP_PRIV_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Sync labels to chunk
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ORG: ${{ github.repository_owner }}
          REPOS: ${{ toJson(matrix.repos) }}
          LABELS: ${{ needs.prepare.outputs.labels }}
        run: |
          set -euo pipefail

          echo "$REPOS" | jq -r '.[]' | while read -r REPO; do
            echo "=== Syncing labels to $REPO ==="
            repo_labels=$(gh api --paginate "repos/$ORG/$REPO/labels?per_page=100" | jq -s 'add // []')

            echo "$LABELS" | jq -c '.[]' | while read -r label; do
              name=$(echo "$label" | jq -r '.name')
              color=$(echo "$label" | jq -r '.color')
              description=$(echo "$label" | jq -r '.description')

              existing_label=$(echo "$repo_labels" | jq -c --arg name "$name" '.[] | select(.name == $name)')

              if [ -z "$existing_label" ]; then
                gh api --method POST "repos/$ORG/$REPO/labels" \
                  --raw-field name="$name" \
                  --raw-field color="$color" \
                  --raw-field description="$description" \
                  --jq '"  [created] \(.name)"'
              else
                existing_color=$(echo "$existing_label" | jq -r '.color // ""')
                existing_desc=$(echo "$existing_label" | jq -r '.description // ""')
                if [ "$existing_color" = "$color" ] && [ "$existing_desc" = "$description" ]; then
                  echo "  [skip]    $name"
                else
                  encoded_name=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))" "$name")
                  gh api --method PATCH "repos/$ORG/$REPO/labels/$encoded_name" \
                    --raw-field name="$name" \
                    --raw-field color="$color" \
                    --raw-field description="$description" \
                    --jq '"  [updated] \(.name)"'
                fi
              fi
            done
          done
