name: dev - test framework
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-dev-tests
  cancel-in-progress: true
on:
  push:
    branches:
    - main
  pull_request:
    # No paths: filter — must run on every PR to always produce the gate check
jobs:
  detect-changes:
    name: Detect test path changes
    runs-on: ubuntu-24.04
    outputs:
      tests: ${{ steps.filter.outputs.tests }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check for test path changes
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            tests:
              - 'tests/**'

  black:
    name: Black (formatting)
    needs: [detect-changes]
    if: needs.detect-changes.outputs.tests == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # pin@v7.0.0
        with:
          python-version: "3.13"

      - name: Run black (diff check)
        run: make -f tests/dev.makefile lint-black

  isort:
    name: isort (import sorting)
    needs: [detect-changes]
    if: needs.detect-changes.outputs.tests == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # pin@v7.0.0
        with:
          python-version: "3.13"

      - name: Run isort
        run: make -f tests/dev.makefile lint-isort

  pyright:
    name: Pyright (type checking)
    needs: [detect-changes]
    if: needs.detect-changes.outputs.tests == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # pin@v7.0.0
        with:
          python-version: "3.13"

      - name: Run pyright
        run: make -f tests/dev.makefile lint-pyright

  coverage:
    name: Coverage (feature/test coverage reporting)
    needs: [detect-changes]
    if: needs.detect-changes.outputs.tests == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # pin@v7.0.0
        with:
          python-version: "3.13"

      - name: Run coverage
        run: make -f tests/dev.makefile coverage

      - name: Write Coverage Summary
        if: always()
        run: |
          if [ -f tests/coverage_report.md ]; then
            cat tests/coverage_report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Generate Coverage Report
        uses: gardenlinux/pytest-multi-results-action@8fc9cd734e3bfac0057ca43d70cd561b5f4d52bb
        if: always()
        with:
          files: |
            tests/coverage_report.xml
          title: "Garden Linux Feature/Test Coverage Report"
          summary: false
          result-types: "passed,skipped,failed"
          fail-on-empty: true

      - name: Upload report artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # pin@v7.0.1
        if: always()
        with:
          name: coverage-report
          path: |
            tests/coverage_report.xml
            tests/coverage_report.json
            tests/coverage_report.md
          retention-days: 30

  test-plugins:
    name: Test plugins
    needs: [detect-changes]
    if: needs.detect-changes.outputs.tests == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Run test-plugins
        run: make -f tests/dev.makefile test-plugins

  test-utils:
    name: Test utils
    needs: [detect-changes]
    if: needs.detect-changes.outputs.tests == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Run test-utils
        run: make -f tests/dev.makefile test-utils

  dev-tests-gate:
    name: Dev tests gate
    needs: [detect-changes, black, isort, pyright, coverage, test-plugins, test-utils]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Evaluate dev tests result
        run: |
          TESTS_CHANGED="${{ needs.detect-changes.outputs.tests }}"
          if [[ "$TESTS_CHANGED" != "true" ]]; then
            echo "Test paths not changed; skipping dev tests — gate passes."
            exit 0
          fi
          BLACK="${{ needs.black.result }}"
          ISORT="${{ needs.isort.result }}"
          PYRIGHT="${{ needs.pyright.result }}"
          COVERAGE="${{ needs.coverage.result }}"
          TEST_PLUGINS="${{ needs.test-plugins.result }}"
          TEST_UTILS="${{ needs.test-utils.result }}"
          FAILED=0
          for result in "$BLACK" "$ISORT" "$PYRIGHT" "$COVERAGE" "$TEST_PLUGINS" "$TEST_UTILS"; do
            if [[ "$result" != "success" ]]; then
              FAILED=1
            fi
          done
          if [[ "$FAILED" == "1" ]]; then
            echo "One or more dev test jobs did not succeed."
            echo "black=$BLACK isort=$ISORT pyright=$PYRIGHT coverage=$COVERAGE test-plugins=$TEST_PLUGINS test-utils=$TEST_UTILS"
            exit 1
          fi
          echo "All dev test jobs passed."
