name: test_flavor
on:
  workflow_call:
    inputs:
      arch:
        type: string
        default: "amd64"
      cname:
        type: string
        required: true
jobs:
  test:
    name: Test OCI flavor ${{ inputs.cname }} (${{ inputs.arch }})
    runs-on: ${{ inputs.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    if: ${{ inputs.cname != 'skip' }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      ABN: ""
    permissions:
      actions: write
    steps:
      - name: install required packages
        run: |
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends libxml2-utils retry
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin@v7.0.1
        with:
          submodules: true
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # pin@v6.1.0
        with:
          path: |
            COMMIT
            VERSION
          key: build-${{ inputs.cname }}-${{ inputs.arch }}-${{ github.run_id }}
          fail-on-cache-miss: true
      - name: Download test distribution
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # pin@v6.1.0
        with:
          path: tests/.build
          key: test-distribution-${{ github.run_id }}
      - name: Install python-gardenlinux-lib
        uses: gardenlinux/python-gardenlinux-lib/.github/actions/setup@cb0202dc1267aac66b04578a35b4db35edf1ba5b # pin@1.0.6
      - name: Set ABN
        run: |
          echo "ABN=$(gl-features-parse --cname ${{ inputs.cname }} --arch ${{ inputs.arch }} artifact-base-name)" | tee -a "$GITHUB_ENV"
      - name: Load flavor build artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # pin@v8.0.2
        with:
          name: build-${{ inputs.cname }}-${{ inputs.arch }}
      - name: unpack build artifacts
        run: |
          mkdir ".build"
          tar -C .build -xzf $ABN.tar.gz
          rm "$ABN.tar.gz"
          tree .build
        # TODO: handle skipping better
      - name: Execute tests
        run: |
          if [ -e ".build/$ABN.oci" ]; then
            ./test ".build/$ABN.oci"
          else
            echo "skipping non oci file"
          fi
      - name: Copy test results to build directory
        if: always()
        run: |
          cp tests/log/oci.test.log .build/${ABN}.oci.test.log || true
          cp tests/log/oci.test.xml .build/${ABN}.oci.test.xml || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # pin@v7.0.2
        if: always()
        with:
          if-no-files-found: ignore # in case test fails before writing a log
          overwrite: true # overwrite logs from previous attempt
          name: oci-test-${{ env.ABN }}
          path: |
            .build/${{ env.ABN }}.oci.test.log
            .build/${{ env.ABN }}.oci.test.xml
