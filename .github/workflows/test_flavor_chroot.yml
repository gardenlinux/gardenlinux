name: test_flavor
on:
  workflow_call:
    inputs:
      arch:
        type: string
        default: "amd64"
      flavor:
        type: string
        required: true
jobs:
  test:
    name: Test flavor ${{ inputs.flavor }} (${{ inputs.arch }}) in chroot
    runs-on: ${{ inputs.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    if: ${{ inputs.flavor != 'skip' }}
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    env:
      ABN: ""
    permissions:
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin@v7.0.1
        with:
          submodules: true
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # pin@v6.1.0
        with:
          path: |
            COMMIT
            VERSION
          key: build-${{ inputs.flavor }}-${{ inputs.arch }}-${{ github.run_id }}
          fail-on-cache-miss: true
      - name: Download test distribution
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # pin@v6.1.0
        with:
          path: tests/.build
          key: test-distribution-${{ github.run_id }}
      - name: Install python-gardenlinux-lib
        uses: gardenlinux/python-gardenlinux-lib/.github/actions/setup@0108ebe0381f8c6225d1813b365e2fe639a80686 # pin@0.10.25
      - name: Set ABN
        run: |
          echo "ABN=$(gl-features-parse --cname ${{ inputs.flavor }}-${{ inputs.arch }} cname)" | tee -a "$GITHUB_ENV"
      - name: Load flavor build artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # pin@v8.0.2
        with:
          name: build-${{ inputs.flavor }}-${{ inputs.arch }}
      - name: Execute tests
        run: |
          mkdir ".build"
          tar -C .build -xzf "${ABN}.tar.gz"
          rm "${ABN}.tar.gz"
          ./test ".build/${ABN}.tar"
      - name: Copy test results to build directory
        if: always()
        run: |
          cp tests/log/chroot.test.log .build/${ABN}.chroot.test.log || true
          cp tests/log/chroot.test.xml .build/${ABN}.chroot.test.xml || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # pin@v7.0.2
        if: always()
        with:
          if-no-files-found: ignore # in case test fails before writing a log
          overwrite: true # overwrite logs from previous attempt
          name: chroot-test-${{ env.ABN }}
          path: |
            .build/${{ env.ABN }}.chroot.test.log
            .build/${{ env.ABN }}.chroot.test.xml
