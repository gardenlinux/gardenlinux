name: testng_flavor
on:
  workflow_call:
    inputs:
      arch:
        type: string
        default: "amd64"
      flavor:
        type: string
        required: true
jobs:
  test:
    name: Test flavor ${{ inputs.flavor }} (${{ inputs.arch }}) in chroot
    runs-on: ${{ inputs.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    if: ${{ inputs.flavor != 'skip' }}
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    env:
      CNAME: ""
    permissions:
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # pin@v6.1.0
        with:
          path: |
            COMMIT
            VERSION
          key: build-${{ inputs.flavor }}-${{ inputs.arch }}-${{ github.run_id }}
          fail-on-cache-miss: true
      - name: Download test distribution artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # pin@v8.0.1
        with:
          name: test-distribution
          path: tests-ng/.build
      - name: Install python-gardenlinux-lib
        uses: gardenlinux/python-gardenlinux-lib/.github/actions/setup@19c1b24c01faab81a7fe24713748dd172d00904a # pin@0.10.16
      - name: Set CNAME
        run: |
          echo "CNAME=$(gl-features-parse --cname ${{ inputs.flavor }}-${{ inputs.arch }} cname)" | tee -a "$GITHUB_ENV"
      - name: Load flavor build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # pin@v8.0.1
        with:
          name: build-${{ inputs.flavor }}-${{ inputs.arch }}
      - name: Execute tests
        run: |
          mkdir ".build"
          tar -C .build -xzf "${CNAME}.tar.gz"
          rm "${CNAME}.tar.gz"
          ./test-ng ".build/${CNAME}.tar"
      - name: Copy test results to build directory
        if: always()
        run: |
          cp tests-ng/log/chroot.test-ng.log .build/${CNAME}.chroot.testng.log || true
          cp tests-ng/log/chroot.test-ng.xml .build/${CNAME}.chroot.testng.xml || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # pin@v7.0.1
        if: always()
        with:
          if-no-files-found: ignore
          name: chroot-testng-${{ env.CNAME }}
          path: |
            .build/${{ env.CNAME }}.chroot.testng.log
            .build/${{ env.CNAME }}.chroot.testng.xml
