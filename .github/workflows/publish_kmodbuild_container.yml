name: Publish container images
on:
  workflow_call:
    inputs:
      run_id:
        type: string
        required: true
      version:
        type: string
        required: true
      compatibility_flags:
        description: "Flags to activate compatibility modes"
        type: string
        default: ""
env:
  GL_COMPATIBILITY_FLAGS: ${{ inputs.compatibility_flags }}
jobs:
  kmodbuild_container:
    name: Publish kernel module build dev container
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ inputs.version }}
    strategy:
      matrix:
        arch: [amd64, arm64]
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin@v7.0.1
        with:
          submodules: true
      - name: Install python-gardenlinux-lib
        uses: gardenlinux/python-gardenlinux-lib/.github/actions/setup@51a93bcab598b762753b073bd22ee00dcf622e3a # pin@1.0.8
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # pin@v8.0.2
        with:
          name: kmodbuild-container-${{ matrix.arch }}
          github-token: ${{ github.token }}
          run-id: ${{ inputs.run_id }}
      - name: Publish kernel module build dev container (${{ matrix.arch }})
        env:
          GL_CLI_REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GL_CLI_REGISTRY_USERNAME: ${{ github.repository_owner }}
          GL_CLI_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Workaround Podman API login() issue
          podman login -u "${GL_CLI_REGISTRY_USERNAME}" -p "${GL_CLI_REGISTRY_PASSWORD}" ghcr.io

          gl-oci load-image --oci-archive "kmodbuild_container_${{ matrix.arch }}.oci"
          rm *.oci

          gl-oci push-image --repository "ghcr.io/${{ github.repository }}/kmodbuild" --tag "${{ matrix.arch }}-$VERSION"
          gl-oci add-image-to-index --platform linux/${{ matrix.arch }} --index "ghcr.io/${{ github.repository }}/kmodbuild" --index-tag "$VERSION" --repository "ghcr.io/${{ github.repository }}/kmodbuild" --tag "${{ matrix.arch }}-$VERSION"
