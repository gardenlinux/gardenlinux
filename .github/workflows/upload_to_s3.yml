name: upload to S3
on:
  workflow_call:
    inputs:
      commit_id:
        type: string
        required: true
      version:
        type: string
        required: true
      flavors_matrix:
        type: string
        required: true
      run_id:
        type: string
        required: true
      with_certs:
        type: boolean
        default: false
      compatibility_flags:
        description: 'Flags to activate compatibility modes'
        type: string
        default: ''
    secrets:
      aws_role:
        required: true
      aws_session:
        required: true
      aws_region:
        required: true
      aws_s3_bucket:
        required: true
env:
  GL_COMPATIBILITY_FLAGS: ${{ inputs.compatibility_flags }}
jobs:
  upload_to_s3:
    name: upload to S3
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    env:
      ARTIFACT_BASE_NAME: ""
      GL_ALLOW_MULTIPLE_PLATFORMS: "1"
    permissions:
      id-token: write
    environment: oidc_aws_s3_upload
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(inputs.flavors_matrix) }}
    steps:
      - if: ${{ contains(inputs.compatibility_flags, 'full_checkout') }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit_id }}
          submodules: true
      - name: Install python-gardenlinux-lib
        uses: gardenlinux/python-gardenlinux-lib/.github/actions/setup@385aaad34c414d49583c0fe3e03243d110640770 # pin@0.10.25
      - uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7 # pin@v4
        with:
          role-to-assume: ${{ secrets.aws_role }}
          role-session-name: ${{ secrets.aws_session }}
          aws-region: ${{ secrets.aws_region }}
          role-duration-seconds: 14400 # 4 hours
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # pin@v8.0.1
        with:
          name: build-${{ matrix.flavor }}-${{ matrix.arch }}
          github-token: ${{ github.token }}
          run-id: ${{ inputs.run_id }}
      - name: Set ARTIFACT_BASE_NAME
        run: |
          echo "ARTIFACT_BASE_NAME=$(gl-features-parse --cname ${{ matrix.flavor }} --arch ${{ matrix.arch }} --version ${{ inputs.version }} --commit ${{ inputs.commit_id }} cname)" | tee -a "$GITHUB_ENV"
      - name: Load test artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # pin@v8.0.1
        with:
          pattern: "*-test-${{ env.ARTIFACT_BASE_NAME }}"
          merge-multiple: true
          github-token: ${{ github.token }}
          run-id: ${{ inputs.run_id }}
      - if: ${{ inputs.with_certs }}
        name: Load certs artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # pin@v8.0.1
        with:
          name: certs
          github-token: ${{ github.token }}
          run-id: ${{ inputs.run_id }}
          path: cert/
      - name: Prepare S3 upload artifacts
        run: |
          mkdir -p "$ARTIFACT_BASE_NAME"
          tar -C $ARTIFACT_BASE_NAME -xzvf "$ARTIFACT_BASE_NAME.tar.gz"
          rm "$ARTIFACT_BASE_NAME.tar.gz"

          if [ -f "$ARTIFACT_BASE_NAME.chroot.test.log" ]; then
            mv $ARTIFACT_BASE_NAME.chroot.test.log "$ARTIFACT_BASE_NAME"
            mv $ARTIFACT_BASE_NAME.chroot.test.xml "$ARTIFACT_BASE_NAME"
          fi

          if [ -f "$ARTIFACT_BASE_NAME.cloud.test.log" ]; then
            mv $ARTIFACT_BASE_NAME.cloud.test.log "$ARTIFACT_BASE_NAME"
            mv $ARTIFACT_BASE_NAME.cloud.test.xml "$ARTIFACT_BASE_NAME"
          fi

          if [ -f "$ARTIFACT_BASE_NAME.oci.test.log" ]; then
            mv $ARTIFACT_BASE_NAME.oci.test.log "$ARTIFACT_BASE_NAME"
            mv $ARTIFACT_BASE_NAME.oci.test.xml "$ARTIFACT_BASE_NAME"
          fi

          if [ -f "$ARTIFACT_BASE_NAME.qemu.test.log" ]; then
            mv $ARTIFACT_BASE_NAME.qemu.test.log "$ARTIFACT_BASE_NAME"
            mv $ARTIFACT_BASE_NAME.qemu.test.xml "$ARTIFACT_BASE_NAME"
          fi
      - if: ${{ inputs.with_certs }}
        name: Add certs to build artifacts
        run: |
          pushd cert
          for file in "secureboot."*; do
            mv "$file" "../$ARTIFACT_BASE_NAME/$ARTIFACT_BASE_NAME.$file"
          done
          popd
      - name: Upload to S3 bucket ${{ secrets.aws_s3_bucket }}
        run: |
          gl-s3 --bucket ${{ secrets.aws_s3_bucket }} --path "$ARTIFACT_BASE_NAME" upload-artifacts-to-bucket --artifact-name "$ARTIFACT_BASE_NAME"
