name: test_flavor
on:
  workflow_call:
    inputs:
      arch:
        type: string
        default: "amd64"
      cname:
        type: string
        required: true
    secrets:
      gcp_identity_provider:
        required: true
      gcp_service_account:
        required: true
      gcp_project_id:
        required: true
      gcp_region:
        required: true
      gcp_zone:
        required: true
      aws_role:
        required: true
      aws_session:
        required: true
      aws_region:
        required: true
      aws_s3_bucket:
        required: true
      az_client_id:
        required: true
      az_tenant_id:
        required: true
      az_subscription_id:
        required: true
      alibaba_cloud_role_arn:
        required: true
      alibaba_cloud_oidc_provider_arn:
        required: true
      alibaba_cloud_region:
        required: true
      tf_encryption:
        required: true
jobs:
  test:
    name: Test flavor ${{ inputs.cname }} (${{ inputs.arch }}) in cloud
    runs-on: "ubuntu-24.04"
    if: ${{ inputs.cname != 'skip' }}
    # timeout-minutes: 30
    environment: oidc_platform_tests
    defaults:
      run:
        shell: bash
    env:
      ABN: ""
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      id-token: write
      actions: write
    steps:
      - name: install dependencies
        run: |
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends podman make curl jq unzip qemu-utils retry
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # pin@v6.1.0
        with:
          path: |
            COMMIT
            VERSION
          key: build-${{ inputs.cname }}-${{ inputs.arch }}-${{ github.run_id }}
          fail-on-cache-miss: true
      - name: Download test distribution
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # pin@v6.1.0
        with:
          path: tests/.build
          key: test-distribution-${{ github.run_id }}
      - name: Load certs artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # pin@v8.0.1
        with:
          name: certs
          path: cert/
      - name: Install python-gardenlinux-lib
        uses: gardenlinux/python-gardenlinux-lib/.github/actions/setup@385aaad34c414d49583c0fe3e03243d110640770 # pin@0.10.25
        with:
          version: 1.0.0-pre1
      - name: Set ABN
        run: |
          echo "ABN=$(gl-features-parse --cname ${{ inputs.cname }} --arch ${{ inputs.arch }} artifact-base-name)" | tee -a "$GITHUB_ENV"
      - name: Set CLOUD
        run: |
          echo "CLOUD=${ABN%%-*}" | tee -a "$GITHUB_ENV"
      - name: Load flavor build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # pin@v8.0.1
        with:
          name: build-${{ inputs.cname }}-${{ inputs.arch }}
      - name: unpack build artifacts
        run: |
          mkdir ".build"
          tar -C .build -xzf $ABN.tar.gz
          rm "$ABN.tar.gz"
          tree .build
      - name: "Authenticate to Google Cloud"
        if: ${{ startsWith(inputs.cname, 'gcp-') }}
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.gcp_identity_provider }}
          service_account: ${{ secrets.gcp_service_account }}
          create_credentials_file: true
          cleanup_credentials: true
          export_environment_variables: true
      - name: Set GCP platform-test environment
        if: ${{ startsWith(inputs.cname, 'gcp-') }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            // tf provider vars
            core.exportVariable("GOOGLE_PROJECT", "${{ secrets.gcp_project_id }}");
            core.exportVariable("GOOGLE_REGION", "${{ secrets.gcp_region }}");
            core.exportVariable("GOOGLE_ZONE", "${{ secrets.gcp_zone }}");
      - id: "auth_aws"
        name: "Authenticate to AWS"
        uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7 # pin@v4
        with:
          role-to-assume: ${{ secrets.aws_role }}
          role-session-name: ${{ secrets.aws_session }}
          aws-region: ${{ secrets.aws_region }}
          output-credentials: true
      - name: Set AWS platform-test environment
        if: ${{ startsWith(inputs.cname, 'aws-') }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            // tf provider auth
            core.setSecret("${{ steps.auth_aws.outputs.aws-access-key-id }}");
            core.exportVariable("AWS_ACCESS_KEY_ID", "${{ steps.auth_aws.outputs.aws-access-key-id }}");
            core.setSecret("${{ steps.auth_aws.outputs.aws-secret-access-key }}");
            core.exportVariable("AWS_SECRET_ACCESS_KEY", "${{ steps.auth_aws.outputs.aws-secret-access-key }}");
            core.setSecret("${{ steps.auth_aws.outputs.aws-session-token }}");
            core.exportVariable("AWS_SESSION_TOKEN", "${{ steps.auth_aws.outputs.aws-session-token }}");
            // tf provider vars
            core.exportVariable("AWS_REGION", "${{ secrets.aws_region }}");
      - id: "auth_azure"
        if: ${{ startsWith(inputs.cname, 'azure-') }}
        name: "Authenticate to Azure"
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # pin@v1
        with:
          client-id: ${{ secrets.az_client_id }}
          tenant-id: ${{ secrets.az_tenant_id }}
          subscription-id: ${{ secrets.az_subscription_id }}
      - name: Set Azure platform-test environment
        if: ${{ startsWith(inputs.cname, 'azure-') }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            // tf provider auth
            core.exportVariable("ARM_USE_OIDC", "true");
            core.exportVariable("AZURE_CONFIG_DIR", "$RUNNER_TEMP/azure_config_dir");
            core.setSecret("${{ secrets.az_client_id }}");
            core.exportVariable("ARM_CLIENT_ID", "${{ secrets.az_client_id }}");
            core.setSecret("${{ secrets.az_subscription_id }}");
            core.exportVariable("ARM_SUBSCRIPTION_ID", "${{ secrets.az_subscription_id }}");
            core.setSecret("${{ secrets.az_tenant_id }}");
            // tf provider vars
            core.exportVariable("ARM_TENANT_ID", "${{ secrets.az_tenant_id }}");
      - id: "auth_alicloud"
        if: ${{ startsWith(inputs.cname, 'ali-') }}
        name: "Authenticate to Alicloud"
        uses: aliyun/configure-aliyun-credentials-action@1e5248c8d5d93a8781ac344a68e19a43341e79e6 # v1.1.0
        with:
          role-to-assume: ${{ secrets.alibaba_cloud_role_arn }}
          oidc-provider-arn: ${{ secrets.alibaba_cloud_oidc_provider_arn }}
          role-session-expiration: 21600
      - name: "Set Alicloud platform-test environment"
        if: ${{ startsWith(inputs.cname, 'ali-') }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            // tf provider vars
            core.exportVariable("ALIBABA_CLOUD_REGION", "${{ secrets.alibaba_cloud_region }}");
        # TODO: handle skipping better
      - name: Execute tests
        run: |
          if [ ! -e ".build/$ABN.raw" ]; then
            if [ -e ".build/$ABN.vhd" ]; then
              echo "converting vhd to raw"
              qemu-img convert -f vpc -O raw ".build/$ABN.vhd" ".build/$ABN.raw"
            elif [ -e ".build/$ABN.qcow2" ]; then
              echo "converting qcow2 to raw"
              qemu-img convert -f qcow2 -O raw ".build/$ABN.qcow2" ".build/$ABN.raw"
            elif [ -e ".build/$ABN.gcpimage.tar.gz" ]; then
              echo "converting gcpimage to raw"
              tar -C .build -xzf ".build/$ABN.gcpimage.tar.gz"
              mv ".build/disk.raw" ".build/$ABN.raw"
            fi
          fi
          if [ -e ".build/$ABN.raw" ]; then
            # enable remote state S3 backend
            cp "tests/util/tf/backend.tf.github" "tests/util/tf/backend.tf"

            # enable state encryption
            export TF_ENCRYPTION="$(base64 -d <<< ${{ secrets.tf_encryption }})"

            # run test
            export TF_VAR_prefix="gh-${{ github.run_id }}"
            ./test --cloud $CLOUD ".build/$ABN.raw"

          else
            echo "no raw file, cloud test failed"
            exit 1
          fi
      - name: Copy test results to build directory
        if: always()
        run: |
          cp tests/log/cloud.test.log .build/${ABN}.cloud.test.log || true
          cp tests/log/cloud.test.xml .build/${ABN}.cloud.test.xml || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # pin@v7.0.1
        if: always()
        with:
          if-no-files-found: ignore # in case test fails before writing a log
          overwrite: true # overwrite logs from previous attempt
          name: cloud-test-${{ env.ABN }}
          path: |
            .build/${{ env.ABN }}.cloud.test.log
            .build/${{ env.ABN }}.cloud.test.xml
      - name: Cleanup cloud test for ${{ inputs.cname }} (${{ inputs.arch }})
        if: always()
        run: |
          # enable remote state S3 backend
          cp "tests/util/tf/backend.tf.github" "tests/util/tf/backend.tf"

          # enable state encryption
          export TF_ENCRYPTION="$(base64 -d <<< ${{ secrets.tf_encryption }})"

          # run cleanup
          export TF_VAR_prefix="gh-${{ github.run_id }}"
          ./test --cloud $CLOUD --only-cleanup ".build/$ABN.raw" || true
