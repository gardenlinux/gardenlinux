# Ordering: run the /etc-reset hooks after cloud-init's config stage, so the
# 00-cloud-init-useradd hook observes cloud-init's final user state and never
# races cloud-init's own user creation.
#
# This drop-in is shipped by the cloud-init feature (NOT by _usi) so the generic
# _usi hook-runner service stays cloud-init-agnostic. After= on a unit that is
# absent (non-cloud-init images) is a harmless no-op, and we deliberately do NOT
# use Wants=/Requires= here: we must never pull cloud-config.service into the
# boot on images that would not otherwise run it.
#
# Why After= (hook runs after cloud-config):
#   - First boot:  cloud-config creates the user first; the hook then sees it
#                  already exists and no-ops.
#   - Reset boot:  cloud-init's users_groups is PER_INSTANCE and its semaphore
#                  under /var/lib/cloud survives the /etc wipe, so cloud-config
#                  skips user creation; the hook then recreates the user from the
#                  surviving /home/<user> -> no conflicting writes either way.
[Unit]
After=cloud-config.service
